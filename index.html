<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ትዝታ-AI | INSA Cyber Talent Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">INSA Cyber Talent Center</span>
      <h1>ትዝታ-AI</h1>
      <p>ስለ ኢኖቬሽን እና ሳይበር ታለንት የክረምት ካምፕ ይጠይቁ</p>
    </div>

    <form class="form-group" >
      <textarea id="userInput" name="question" placeholder="ጥያቄዎን እዚህ ያስገቡ... (ምሳሌ፦ የካምፑ ምዝገባ መስፈርቶች ምንድን ናቸው?)"></textarea>
      <button id="submitBtn" type="button">ይጠይቁ</button>
    </form>

    <div class="response-box" id="responseBox">
      <div class="response-title">መልስ</div>
      <div class="response-content" id="responseContent" placeholder="your answer goes here">መልስዎን እዚህ ጋር ይመልከቱ </div>
    </div>
  </div>
<script type="module" src="script.js"></script>
</body>
</html>
