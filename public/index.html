<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizita-AI | INSA Cyber Talent Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="top-bar">
  <div id="welcomeMessage" class="welcome-msg"></div>
</div>
    <div class="header">
      <span class="badge">INSA Cyber Talent Center</span>
      <h1>ትዝታ-AI</h1>
      <p>Ask About Cyber Talent Center (INSA)</p>
    </div>

    <form class="form-group">
      <textarea id="userInput" name="question" placeholder="Enter your question here... (e.g., What are the camp registration requirements?)" required></textarea>
      <button id="submitBtn" type="button">Ask Question (ጠይቅ)</button>
      
    </form>

    <div class="response-box" id="responseBox">
      <div class="response-title">Response</div>
      <div class="response-content" id="responseContent">Your response will appear here ...</div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
